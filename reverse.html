<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reverse hole diameter calculator"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Airflow Calculator - Reverse Calculation</title>
  </head>
  <body>
    <div class="container">
      <h1>Reverse Diameter Calculation</h1>

      <div class="tabs">
        <a href="index.html" class="tab">Forward Calculation</a>
        <a href="reverse.html" class="tab active">Reverse Calculation</a>
      </div>

      <div class="input-group">
        <label for="target-diameter">Target equivalent diameter (mm):</label>
        <input
          type="number"
          id="target-diameter"
          step="0.01"
          placeholder="Enter diameter"
        />
      </div>

      <div class="slider-container">
        <label for="holes-count">Number of holes:</label>
        <input
          type="range"
          id="holes-count"
          min="2"
          max="4"
          value="2"
          step="1"
        />
        <div class="slider-value" id="holes-value">2 holes</div>
      </div>

      <div class="input-group">
        <label>Calculation type:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="calculation-type" value="equal" checked />
            Equal diameters
          </label>
          <label class="radio-label">
            <input type="radio" name="calculation-type" value="custom" />
            Custom ratio
          </label>
        </div>
      </div>

      <div id="ratio-container" style="display: none">
        <div class="input-group">
          <label for="ratio">Ratio between holes:</label>
          <input type="text" id="ratio" placeholder="e.g.: 1:2 or 1:2:1" />
          <small
            >Specify ratio with colons (e.g. 1:2 or 1:1:2)</small
          >
        </div>
      </div>

      <button id="calculate-reverse-btn">Calculate</button>

      <div class="solutions" id="solutions"></div>
    </div>
    <script type="text/javascript" src="js/reverse.js"></script>
  </body>
</html>
