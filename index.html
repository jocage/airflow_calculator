<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Equivalent diameter calculator for any number of holes"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Airflow Calculator</title>
  </head>
  <body>
    <div class="container">
      <h1>Equivalent Diameter Calculator</h1>

      <div class="tabs">
        <a href="index.html" class="tab active">Forward Calculation</a>
        <a href="reverse.html" class="tab">Reverse Calculation</a>
        <a href="tab3.html" class="tab">Click Me</a>
      </div>

      <div id="inputs-container">
        <div class="input-group">
          <label for="diameter1">Hole diameter 1 (mm):</label>
          <input
            type="number"
            id="diameter1"
            class="diameter-input"
            step="0.01"
            placeholder="Enter diameter"
          />
        </div>
        <div class="input-group">
          <label for="diameter2">Hole diameter 2 (mm):</label>
          <input
            type="number"
            id="diameter2"
            class="diameter-input"
            step="0.01"
            placeholder="Enter diameter"
          />
        </div>
      </div>
      <div class="button-group">
        <button id="add-hole">Add hole</button>
        <button id="remove-hole">Remove hole</button>
      </div>
      <button id="calculate-btn">Calculate</button>
      <div class="result" id="result"></div>
    </div>
    <script type="text/javascript" src="js/main.js"></script>
  </body>
</html>
